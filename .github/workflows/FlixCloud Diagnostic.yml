name: FlixCloud Diagnostic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test FlixCloud
        run: |
          node <<'EOF'
          const embedUrls = [
            "https://flixcloud.cc/e/vrjc7cnt8mvx?v=1",
            "https://flixcloud.cc/e/vrjc7cnt8mvx?v=2"
          ];

          const ua =
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
            "AppleWebKit/537.36 (KHTML, like Gecko) " +
            "Chrome/120.0.0.0 Safari/537.36";

          const headers = {
            "User-Agent": ua,
            "Accept": "*/*",
            "Origin": "https://flixcloud.cc",
            "Referer": "https://flixcloud.cc/"
          };

          async function testEmbed(url) {
            console.log("");
            console.log("============================================================");
            console.log("FLIXCLOUD EMBED");
            console.log(url);
            console.log("============================================================");

            try {
              const res = await fetch(url, {
                redirect: "manual",
                headers
              });

              console.log("STATUS    :", res.status);
              console.log("TYPE      :", res.headers.get("content-type"));
              console.log("SERVER    :", res.headers.get("server"));
              console.log("CF-RAY    :", res.headers.get("cf-ray"));
              console.log("LOCATION  :", res.headers.get("location"));

              const text = await res.text();

              console.log("");
              console.log("BODY:");
              console.log(text.slice(0, 2000));

            } catch (e) {
              console.log("ERROR:", e.message);
            }
          }

          async function testDownload(url) {
            const match = url.match(/\/e\/([a-z0-9]+)/i);

            if (!match) {
              console.log("Could not extract access ID");
              return;
            }

            const aid = match[1];

            const url2 =
              `https://flixcloud.cc/d/${aid}/__data.json`;

            console.log("");
            console.log("============================================================");
            console.log("FLIXCLOUD DOWNLOAD DATA");
            console.log(url2);
            console.log("============================================================");

            try {
              const res = await fetch(url2, {
                redirect: "manual",
                headers: {
                  "User-Agent": ua,
                  "Accept": "*/*",
                  "Referer": "https://flixcloud.cc/"
                }
              });

              console.log("STATUS    :", res.status);
              console.log("TYPE      :", res.headers.get("content-type"));
              console.log("SERVER    :", res.headers.get("server"));
              console.log("CF-RAY    :", res.headers.get("cf-ray"));
              console.log("LOCATION  :", res.headers.get("location"));

              const text = await res.text();

              console.log("");
              console.log("BODY:");

              // Don't dump tokens/JWTs or generated download URLs.
              console.log(
                text
                  .slice(0, 2000)
                  .replace(
                    /eyJ[\w-]+\.[\w-]+\.[\w-]+/g,
                    "[JWT_REDACTED]"
                  )
              );

            } catch (e) {
              console.log("ERROR:", e.message);
            }
          }

          async function main() {
            for (const url of embedUrls) {
              await testEmbed(url);
              await testDownload(url);
            }

            console.log("");
            console.log("============================================================");
            console.log("FLIXCLOUD DIAGNOSTIC COMPLETE");
            console.log("============================================================");
          }

          main();
          EOF
