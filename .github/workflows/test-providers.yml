name: AniZone Provider Diagnostic

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install cheerio-without-node-native

      - name: Verify provider
        run: |
          echo "========================================"
          echo "ANIZONE PROVIDER DIAGNOSTIC"
          echo "========================================"
          echo "File: providers/anizone.js"
          echo "========================================"
          if [ ! -f "providers/anizone.js" ]; then
            echo "ERROR: providers/anizone.js does not exist"
            exit 1
          fi
          node --check providers/anizone.js

      - name: Create diagnostic test
        run: |
          cat > test-anizone.mjs <<'EOF'
          const provider = await import("./providers/anizone.js");

          if (typeof provider.getStreams !== "function") {
            throw new Error("getStreams() export missing");
          }

          const tests = [
            {
              name: "Bleach S1E4",
              tmdbId: "30984",
              type: "tv",
              season: 1,
              episode: 4
            }
          ];

          for (const test of tests) {
            console.log("");
            console.log("============================================================");
            console.log(`TEST: ${test.name}`);
            console.log("============================================================");
            console.log(`TMDB=${test.tmdbId} TYPE=${test.type} S${test.season}E${test.episode}`);

            try {
              const streams = await provider.getStreams(
                test.tmdbId,
                test.type,
                test.season,
                test.episode
              );

              console.log("");
              console.log(`RESULT: ${streams.length} stream(s)`);

              streams.forEach((stream, index) => {
                console.log("");
                console.log(`STREAM ${index + 1}`);
                console.log(`name: ${stream.name}`);
                console.log(`title: ${stream.title}`);
                console.log(`quality: ${stream.quality}`);
                console.log(`type: ${stream.type}`);
                console.log(`url: ${stream.url || "NONE"}`);
                console.log(`subtitles: ${stream.subtitles?.length || 0}`);
              });
            } catch (error) {
              console.error(`TEST FAILED: ${error.message}`);
              process.exitCode = 1;
            }
          }

          console.log("");
          console.log("============================================================");
          console.log("ANIZONE DIAGNOSTIC COMPLETE");
          console.log("============================================================");
          EOF

      - name: Run diagnostic
        run: |
          node test-anizone.mjs 2>&1 | tee anizone-diagnostic.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anizone-diagnostic
          path: anizone-diagnostic.log
