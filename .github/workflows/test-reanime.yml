name: Test ReAnime

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect AniBridge Reverse Mapping
        run: |
          cat > inspect.js <<'EOF'
          const url =
            "https://github.com/anibridge/anibridge-mappings/releases/download/v3/mappings.min.json";

          console.log("========================================");
          console.log("ANIBRIDGE REVERSE MAPPING DIAGNOSTIC");
          console.log("========================================");

          const response = await fetch(url, {
            headers: {
              Accept: "application/json",
              "User-Agent": "Reanime-Nuvio-Test/1.0"
            }
          });

          console.log("HTTP:", response.status);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const raw = await response.json();

          // ========================================
          // SEARCH TARGETS
          // ========================================

          const tmdbId = "5114";
          const season = 1;

          const target =
            `tmdb_show:${tmdbId}:s${season}`;

          console.log("");
          console.log("========================================");
          console.log("SEARCH TARGET");
          console.log("========================================");

          console.log("Target:", target);

          const matches = [];

          for (const [source, targets] of Object.entries(raw)) {
            if (!targets || typeof targets !== "object") {
              continue;
            }

            for (const [targetKey, mapping] of Object.entries(targets)) {
              if (targetKey === target) {
                matches.push({
                  source,
                  target: targetKey,
                  mapping
                });
              }
            }
          }

          console.log("");
          console.log("Matches:", matches.length);

          for (const match of matches.slice(0, 50)) {
            console.log("");
            console.log("SOURCE:", match.source);
            console.log("TARGET:", match.target);
            console.log(
              "MAPPING:",
              JSON.stringify(match.mapping, null, 2)
            );
          }

          // ========================================
          // SEARCH ALL SEASONS FOR TMDB 5114
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("ALL TMDB 5114 TARGETS");
          console.log("========================================");

          const allMatches = [];

          for (const [source, targets] of Object.entries(raw)) {
            if (!targets || typeof targets !== "object") {
              continue;
            }

            for (const [targetKey, mapping] of Object.entries(targets)) {
              if (targetKey.startsWith(`tmdb_show:${tmdbId}:`)) {
                allMatches.push({
                  source,
                  target: targetKey,
                  mapping
                });
              }
            }
          }

          console.log(
            "All TMDB 5114 matches:",
            allMatches.length
          );

          for (const match of allMatches) {
            console.log("");
            console.log("SOURCE:", match.source);
            console.log("TARGET:", match.target);
            console.log(
              "MAPPING:",
              JSON.stringify(match.mapping)
            );
          }

          // ========================================
          // SEARCH IMDb tt0324431 ANYWHERE
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("SEARCH IMDb tt0324431 ANYWHERE");
          console.log("========================================");

          const imdbId = "tt0324431";
          const imdbNeedle = `imdb_movie:${imdbId}`;

          const imdbMatches = [];

          for (const [source, targets] of Object.entries(raw)) {

            if (source === imdbNeedle) {
              imdbMatches.push({
                location: "SOURCE",
                source,
                targets
              });
              continue;
            }

            if (!targets || typeof targets !== "object") {
              continue;
            }

            for (const [targetKey, mapping] of Object.entries(targets)) {
              if (targetKey === imdbNeedle) {
                imdbMatches.push({
                  location: "TARGET",
                  source,
                  target: targetKey,
                  mapping
                });
              }
            }
          }

          console.log(
            "IMDb matches:",
            imdbMatches.length
          );

          for (const match of imdbMatches.slice(0, 20)) {
            console.log("");
            console.log(
              JSON.stringify(match, null, 2)
            );
          }

          // ========================================
          // FIND ANILIST CONNECTIONS FOR TMDB 5114
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("ANILIST CONNECTIONS");
          console.log("========================================");

          const anilistConnections = [];

          for (const match of allMatches) {
            const source = match.source;
            const targets = raw[source];

            if (!targets || typeof targets !== "object") {
              continue;
            }

            for (const [targetKey, mapping] of Object.entries(targets)) {
              if (targetKey.startsWith("anilist:")) {
                anilistConnections.push({
                  source,
                  anilist: targetKey,
                  mapping
                });
              }
            }
          }

          console.log(
            "AniList connections:",
            anilistConnections.length
          );

          for (const connection of anilistConnections) {
            console.log("");
            console.log(
              JSON.stringify(connection, null, 2)
            );
          }

          console.log("");
          console.log("========================================");
          console.log("DONE");
          console.log("========================================");
          EOF

          node inspect.js
