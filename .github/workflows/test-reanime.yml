name: Test ReAnime

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install crypto-js
        run: npm install crypto-js

      - name: Inspect AniBridge
        run: |
          cat > inspect.js <<'EOF'
          const url =
            "https://github.com/anibridge/anibridge-mappings/releases/download/v3/mappings.min.json";

          console.log("========================================");
          console.log("ANIBRIDGE DIAGNOSTIC");
          console.log("========================================");

          const response = await fetch(url, {
            headers: {
              Accept: "application/json",
              "User-Agent": "Reanime-Nuvio-Test/1.0"
            }
          });

          console.log("HTTP:", response.status);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const raw = await response.json();

          console.log("Total entries:", Object.keys(raw).length);

          const imdbEntries = Object.entries(raw)
            .filter(([key]) => key.startsWith("imdb_"));

          console.log("IMDb entries:", imdbEntries.length);

          console.log("");
          console.log("---- FIRST 20 IMDb ENTRIES ----");

          for (const [key, value] of imdbEntries.slice(0, 20)) {
            console.log("");
            console.log("KEY:", key);
            console.log("VALUE:", JSON.stringify(value));
          }

          console.log("");
          console.log("---- SHOW ENTRIES ----");

          const imdbShows = imdbEntries
            .filter(([key]) => key.startsWith("imdb_show:"));

          console.log("IMDb show entries:", imdbShows.length);

          for (const [key, value] of imdbShows.slice(0, 20)) {
            console.log("");
            console.log("SHOW KEY:", key);
            console.log("SHOW VALUE:", JSON.stringify(value));
          }

          console.log("");
          console.log("========================================");
          console.log("DONE");
          console.log("========================================");
          EOF

          node inspect.js
