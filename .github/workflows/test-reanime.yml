name: Test ReAnime Fribb

on:
  workflow_dispatch:

jobs:
  test-reanime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fribb branch
        uses: actions/checkout@v4
        with:
          ref: Breezy9950-patch-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install crypto-js

      - name: Verify provider file
        run: |
          echo "========================================"
          echo "REANIME FRIBB PROVIDER TEST"
          echo "========================================"
          echo "Branch : Breezy9950-patch-2"
          echo "File   : providers/reanime.js"
          echo "========================================"

          if [ ! -f "providers/reanime.js" ]; then
            echo "ERROR: providers/reanime.js does not exist!"
            exit 1
          fi

          echo "Provider file found."
          echo ""

      - name: Check JavaScript syntax
        run: |
          echo "Checking syntax..."

          node --check providers/reanime.js

          echo ""
          echo "Syntax check PASSED."

      - name: Run ReAnime provider
        run: |
          cat > test-reanime.mjs <<'EOF'
          import { createRequire } from "module";

          const require = createRequire(import.meta.url);
          const provider = require("./providers/reanime.js");

          console.log("");
          console.log("========================================");
          console.log("LOADING REANIME PROVIDER");
          console.log("========================================");

          if (!provider || typeof provider.getStreams !== "function") {
            console.error("ERROR: getStreams() was not exported!");
            process.exit(1);
          }

          console.log("Provider loaded successfully.");
          console.log("getStreams : OK");
          console.log(
            "onSettings :",
            typeof provider.onSettings === "function" ? "OK" : "MISSING"
          );

          console.log("");
          console.log("========================================");
          console.log("TEST CASE");
          console.log("========================================");
          console.log("TMDB      : 1429");
          console.log("Type      : tv");
          console.log("Season    : 1");
          console.log("Episode   : 1");
          console.log("========================================");
          console.log("");

          try {
            const streams = await provider.getStreams(
              1429,
              "tv",
              1,
              1
            );

            console.log("");
            console.log("========================================");
            console.log("FINAL RESULT");
            console.log("========================================");

            if (!Array.isArray(streams)) {
              console.error("ERROR: Provider did not return an array.");
              process.exit(1);
            }

            console.log("Stream count:", streams.length);

            if (streams.length === 0) {
              console.log("NO STREAMS RETURNED");
              console.log("");
              console.log("The provider executed successfully,");
              console.log("but no playable streams were produced.");
              process.exit(0);
            }

            for (let i = 0; i < streams.length; i++) {
              const s = streams[i];

              console.log("");
              console.log(`--- STREAM ${i + 1} ---`);
              console.log("Name     :", s.name);
              console.log("Title    :", s.title);
              console.log("Quality  :", s.quality);
              console.log("Type     :", s.type);
              console.log("Provider :", s.provider);
              console.log("Size     :", s.size || "N/A");
              console.log("URL      :", s.url ? "PRESENT" : "MISSING");
            }

            console.log("");
            console.log("========================================");
            console.log("PROVIDER TEST COMPLETE");
            console.log("========================================");

          } catch (error) {
            console.error("");
            console.error("========================================");
            console.error("PROVIDER TEST FAILED");
            console.error("========================================");
            console.error(error?.stack || error);
            process.exit(1);
          }
          EOF

          node test-reanime.mjs
