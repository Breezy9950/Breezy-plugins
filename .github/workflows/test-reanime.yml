name: Test ReAnime

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect AniBridge
        run: |
          cat > inspect.js <<'EOF'
          const url =
            "https://github.com/anibridge/anibridge-mappings/releases/download/v3/mappings.min.json";

          console.log("========================================");
          console.log("ANIBRIDGE SCHEMA DIAGNOSTIC");
          console.log("========================================");

          const response = await fetch(url, {
            headers: {
              Accept: "application/json",
              "User-Agent": "Reanime-Nuvio-Test/1.0"
            }
          });

          console.log("HTTP:", response.status);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const raw = await response.json();

          const keys = Object.keys(raw);

          console.log("Total entries:", keys.length);

          // ========================================
          // COUNT SOURCE PROVIDERS
          // ========================================

          const providers = {};

          for (const key of keys) {
            const provider = key.split(":")[0];

            providers[provider] =
              (providers[provider] || 0) + 1;
          }

          console.log("");
          console.log("---- SOURCE PROVIDERS ----");

          for (const [provider, count] of Object.entries(providers)) {
            console.log(`${provider}: ${count}`);
          }

          // ========================================
          // FIND OUR TEST IMDb ID
          // ========================================

          const testId = "tt0324431";

          console.log("");
          console.log("========================================");
          console.log(`SEARCHING FOR ${testId}`);
          console.log("========================================");

          const matchingKeys = keys.filter(key =>
            key.includes(testId)
          );

          console.log("Matches:", matchingKeys.length);

          for (const key of matchingKeys) {
            console.log("");
            console.log("KEY:", key);
            console.log(
              "VALUE:",
              JSON.stringify(raw[key])
            );
          }

          // ========================================
          // SHOW TARGETS
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("ENTRIES CONTAINING SHOW TARGETS");
          console.log("========================================");

          let showTargetCount = 0;

          for (const key of keys) {
            const value = raw[key];

            if (!value || typeof value !== "object") {
              continue;
            }

            const targets = Object.keys(value);

            const hasShowTarget = targets.some(target =>
              target.startsWith("tmdb_show:") ||
              target.startsWith("tvdb_show:") ||
              target.startsWith("imdb_show:")
            );

            if (hasShowTarget) {
              showTargetCount++;

              if (showTargetCount <= 20) {
                console.log("");
                console.log("SOURCE:", key);
                console.log(
                  "TARGETS:",
                  JSON.stringify(value)
                );
              }
            }
          }

          console.log("");
          console.log(
            "Total entries containing show targets:",
            showTargetCount
          );

          // ========================================
          // IMDb SOURCE EXAMPLES
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("ALL IMDb SOURCE KEY TYPES");
          console.log("========================================");

          const imdbKeys = keys.filter(key =>
            key.startsWith("imdb:")
            || key.startsWith("imdb_movie:")
            || key.startsWith("imdb_show:")
          );

          console.log(
            "IMDb source keys:",
            imdbKeys.length
          );

          for (const key of imdbKeys.slice(0, 30)) {
            console.log(key);
          }

          console.log("");
          console.log("========================================");
          console.log("DONE");
          console.log("========================================");
          EOF

          node inspect.js
