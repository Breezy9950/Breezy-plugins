name: Test ReAnime

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test TMDB to AniList
        run: |
          cat > test.js <<'EOF'
          const TMDB_ID = "5114";
          const TMDB_API_KEY =
            "439c478a771f35c05022f9feabcca01c";

          const ANILIST_URL =
            "https://graphql.anilist.co";

          console.log("========================================");
          console.log("TMDB → ANILIST TEST");
          console.log("========================================");

          // ========================================
          // TMDB
          // ========================================

          const tmdbResponse = await fetch(
            `https://api.themoviedb.org/3/tv/${TMDB_ID}?api_key=${TMDB_API_KEY}&append_to_response=external_ids`
          );

          console.log(
            "TMDB HTTP:",
            tmdbResponse.status
          );

          const tmdb = await tmdbResponse.json();

          console.log("");
          console.log("TMDB:");
          console.log("ID:", TMDB_ID);
          console.log("Name:", tmdb.name);
          console.log(
            "Original name:",
            tmdb.original_name
          );
          console.log(
            "IMDb:",
            tmdb.external_ids?.imdb_id || "none"
          );

          // ========================================
          // ANILIST SEARCH
          // ========================================

          const title =
            tmdb.name ||
            tmdb.original_name;

          const query = `
            query ($search: String) {
              Page(page: 1, perPage: 10) {
                media(
                  search: $search
                  type: ANIME
                ) {
                  id
                  idMal
                  title {
                    romaji
                    english
                    native
                  }
                  season
                  seasonYear
                  episodes
                  format
                }
              }
            }
          `;

          const aniResponse = await fetch(
            ANILIST_URL,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json"
              },
              body: JSON.stringify({
                query,
                variables: {
                  search: title
                }
              })
            }
          );

          console.log("");
          console.log(
            "AniList HTTP:",
            aniResponse.status
          );

          const aniData =
            await aniResponse.json();

          if (aniData.errors) {
            console.log(
              "AniList errors:",
              JSON.stringify(
                aniData.errors,
                null,
                2
              )
            );
          }

          const results =
            aniData.data?.Page?.media || [];

          console.log("");
          console.log(
            "AniList results:",
            results.length
          );

          for (const anime of results) {
            console.log("");
            console.log("────────────────────");
            console.log("AniList ID:", anime.id);
            console.log("MAL ID:", anime.idMal);
            console.log(
              "Romaji:",
              anime.title?.romaji
            );
            console.log(
              "English:",
              anime.title?.english
            );
            console.log(
              "Native:",
              anime.title?.native
            );
            console.log(
              "Season:",
              anime.season
            );
            console.log(
              "Year:",
              anime.seasonYear
            );
            console.log(
              "Episodes:",
              anime.episodes
            );
            console.log(
              "Format:",
              anime.format
            );
          }

          console.log("");
          console.log("========================================");
          console.log("DONE");
          console.log("========================================");
          EOF

          node test.js
