name: Test ReAnime Mapping Methods

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AniZip
            branch: Breezy9950-patch-1
            file: providers/AniZip

          - name: Fribb
            branch: Breezy9950-patch-2
            file: providers/Fribb Anime Lists

          - name: AniMap
            branch: Breezy9950-patch-3
            file: providers/AniMap

          - name: IDMapper
            branch: Breezy9950-patch-4
            file: providers/IDMapper

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Show test information
        run: |
          echo "========================================"
          echo "PROVIDER TEST"
          echo "Method : ${{ matrix.name }}"
          echo "Branch : ${{ matrix.branch }}"
          echo "File   : ${{ matrix.file }}"
          echo "========================================"

      - name: Check provider file
        run: |
          if [ ! -f "${{ matrix.file }}" ]; then
            echo "ERROR: Test file does not exist!"
            echo
            echo "Contents of providers/:"
            find providers -maxdepth 1 -type f -print
            exit 1
          fi

          echo "Provider file found:"
          ls -lh "${{ matrix.file }}"

      - name: Install dependencies
        run: npm install crypto-js

      - name: Run provider
        env:
          TEST_FILE: ${{ matrix.file }}
          TEST_NAME: ${{ matrix.name }}
          TEST_BRANCH: ${{ matrix.branch }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = process.env.TEST_FILE;
          const name = process.env.TEST_NAME;
          const branch = process.env.TEST_BRANCH;

          console.log("");
          console.log("========================================");
          console.log("LOADING PROVIDER");
          console.log("Method :", name);
          console.log("Branch :", branch);
          console.log("File   :", file);
          console.log("========================================");

          if (!fs.existsSync(file)) {
            throw new Error("Provider file does not exist: " + file);
          }

          const provider = require("./" + file);

          if (!provider || typeof provider.getStreams !== "function") {
            throw new Error(
              "Provider does not export getStreams()"
            );
          }

          console.log("[TEST] getStreams() found");
          console.log("[TEST] Calling TMDB 1429 S1E1...");
          console.log("");

          provider
            .getStreams("1429", "tv", 1, 1)
            .then(result => {
              console.log("");
              console.log("========================================");
              console.log("RESULT");
              console.log("========================================");

              console.log(
                JSON.stringify(result, null, 2)
              );

              console.log("");
              console.log("========================================");
              console.log("TEST COMPLETE");
              console.log("========================================");
            })
            .catch(error => {
              console.error("");
              console.error("========================================");
              console.error("PROVIDER ERROR");
              console.error("========================================");
              console.error(error);
              console.error(error?.stack || "");
              process.exit(1);
            });
          NODE
