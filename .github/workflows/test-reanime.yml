name: Test ReAnime

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect AniBridge TMDB Mapping
        run: |
          cat > inspect.js <<'EOF'
          const url =
            "https://github.com/anibridge/anibridge-mappings/releases/download/v3/mappings.min.json";

          console.log("========================================");
          console.log("ANIBRIDGE TMDB DIAGNOSTIC");
          console.log("========================================");

          const response = await fetch(url, {
            headers: {
              Accept: "application/json",
              "User-Agent": "Reanime-Nuvio-Test/1.0"
            }
          });

          console.log("HTTP:", response.status);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const raw = await response.json();

          // ========================================
          // TEST TMDB SHOW
          // ========================================

          const tmdbId = "5114";
          const season = 1;

          const key = `tmdb_show:${tmdbId}:s${season}`;

          console.log("");
          console.log("========================================");
          console.log("TEST MAPPING");
          console.log("========================================");

          console.log("TMDB ID:", tmdbId);
          console.log("Season:", season);
          console.log("Lookup key:", key);

          const entry = raw[key];

          console.log("");
          console.log("ENTRY:");

          if (entry) {
            console.log(JSON.stringify(entry, null, 2));
          } else {
            console.log("NOT FOUND");
          }

          // ========================================
          // FIND ALL TMDB 5114 ENTRIES
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("ALL TMDB 5114 ENTRIES");
          console.log("========================================");

          const matches = Object.entries(raw).filter(
            ([source]) =>
              source === `tmdb_show:${tmdbId}:s0` ||
              source === `tmdb_show:${tmdbId}:s1` ||
              source === `tmdb_show:${tmdbId}:s2` ||
              source === `tmdb_show:${tmdbId}:s3` ||
              source === `tmdb_show:${tmdbId}:s4` ||
              source === `tmdb_show:${tmdbId}:s5`
          );

          console.log("Matches:", matches.length);

          for (const [source, targets] of matches) {
            console.log("");
            console.log("SOURCE:", source);
            console.log(
              "TARGETS:",
              JSON.stringify(targets, null, 2)
            );
          }

          // ========================================
          // TEST IMDb TOO
          // ========================================

          console.log("");
          console.log("========================================");
          console.log("TEST IMDb tt0324431");
          console.log("========================================");

          const imdbId = "tt0324431";

          const imdbMatches = Object.entries(raw).filter(
            ([source, targets]) =>
              source.includes(imdbId) ||
              JSON.stringify(targets).includes(imdbId)
          );

          console.log("Matches:", imdbMatches.length);

          for (const [source, targets] of imdbMatches.slice(0, 20)) {
            console.log("");
            console.log("SOURCE:", source);
            console.log(
              "TARGETS:",
              JSON.stringify(targets, null, 2)
            );
          }

          console.log("");
          console.log("========================================");
          console.log("DONE");
          console.log("========================================");
          EOF

          node inspect.js
