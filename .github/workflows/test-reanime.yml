name: Test ReAnime Fribb

on:
  workflow_dispatch:

jobs:
  test-reanime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fribb branch
        uses: actions/checkout@v4
        with:
          ref: Breezy9950-patch-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install crypto-js

      - name: Verify provider file
        run: |
          echo "========================================"
          echo "REANIME FRIBB PROVIDER TEST"
          echo "========================================"
          echo "Branch : Breezy9950-patch-2"
          echo "File   : providers/reanime.js"
          echo "========================================"

          if [ ! -f "providers/reanime.js" ]; then
            echo "ERROR: providers/reanime.js does not exist!"
            exit 1
          fi

          echo "Provider file found."
          echo ""

      - name: Check JavaScript syntax
        run: |
          echo "Checking syntax..."
          node --check providers/reanime.js
          echo ""
          echo "Syntax check PASSED."

      - name: Run ReAnime tests
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > test-reanime.mjs <<'EOF'
          import { createRequire } from "module";

          const require = createRequire(import.meta.url);
          const provider = require("./providers/reanime.js");

          const TMDB_KEY =
            process.env.TMDB_API_KEY ||
            "439c478a771f35c05022f9feabcca01c";

          const tests = [
            {
              name: "Demon Slayer: Infinity Castle",
              query: "Demon Slayer: Kimetsu no Yaiba - The Movie: Infinity Castle",
              type: "movie",
              season: 1,
              episode: 1
            },
            {
              name: "You and I Are Polar Opposites",
              query: "You and I Are Polar Opposites",
              type: "tv",
              season: 2,
              episode: 1
            },
            {
              name: "Re:ZERO - Theatrical Malice",
              query: "Re:ZERO -Starting Life in Another World-",
              type: "tv",
              season: 3,
              episode: 1
            }
          ];

          async function searchTMDB(query, type) {
            const url =
              `https://api.themoviedb.org/3/search/${type}` +
              `?api_key=${TMDB_KEY}` +
              `&query=${encodeURIComponent(query)}` +
              `&include_adult=false`;

            const response = await fetch(url);

            if (!response.ok) {
              throw new Error(
                `TMDB search HTTP ${response.status}`
              );
            }

            const data = await response.json();

            if (
              !Array.isArray(data.results) ||
              !data.results.length
            ) {
              throw new Error(
                `No TMDB results for "${query}"`
              );
            }

            return data.results;
          }

          async function resolveTest(test) {
            const results =
              await searchTMDB(
                test.query,
                test.type
              );

            console.log("");
            console.log("TMDB SEARCH RESULTS");

            for (
              let i = 0;
              i < Math.min(results.length, 5);
              i++
            ) {
              const item = results[i];

              console.log(
                `${i + 1}.`,
                item.id,
                "|",
                item.title ||
                  item.name ||
                  item.original_title ||
                  item.original_name,
                "|",
                item.release_date ||
                  item.first_air_date ||
                  "N/A"
              );
            }

            const exactQuery =
              test.query.toLowerCase();

            let selected =
              results.find(item => {
                const title =
                  String(
                    item.title ||
                    item.name ||
                    ""
                  ).toLowerCase();

                const original =
                  String(
                    item.original_title ||
                    item.original_name ||
                    ""
                  ).toLowerCase();

                return (
                  title === exactQuery ||
                  original === exactQuery
                );
              });

            if (!selected) {
              selected = results[0];
            }

            return selected;
          }

          async function runTest(test, index) {
            console.log("");
            console.log("");
            console.log("################################################");
            console.log(`# TEST ${index + 1}: ${test.name}`);
            console.log("################################################");
            console.log("");

            try {
              const selected =
                await resolveTest(test);

              const title =
                selected.title ||
                selected.name ||
                selected.original_title ||
                selected.original_name ||
                "Unknown";

              console.log("");
              console.log("========================================");
              console.log("SELECTED TMDB RESULT");
              console.log("========================================");
              console.log("Title   :", title);
              console.log("TMDB ID :", selected.id);
              console.log(
                "Date    :",
                selected.release_date ||
                  selected.first_air_date ||
                  "N/A"
              );
              console.log("Type    :", test.type);
              console.log("Season  :", test.season);
              console.log("Episode :", test.episode);
              console.log("========================================");
              console.log("");

              console.log("CALLING PROVIDER...");

              const start =
                Date.now();

              const streams =
                await provider.getStreams(
                  selected.id,
                  test.type,
                  test.season,
                  test.episode
                );

              const elapsed =
                Date.now() - start;

              console.log("");
              console.log("========================================");
              console.log(`TEST ${index + 1} RESULT`);
              console.log("========================================");
              console.log("Title       :", title);
              console.log("TMDB ID     :", selected.id);
              console.log("Type        :", test.type);
              console.log("Season      :", test.season);
              console.log("Episode     :", test.episode);
              console.log("Time        :", `${elapsed} ms`);

              if (!Array.isArray(streams)) {
                console.log(
                  "RESULT      : INVALID RETURN VALUE"
                );

                return {
                  passed: false,
                  count: 0
                };
              }

              console.log(
                "Stream count:",
                streams.length
              );

              if (!streams.length) {
                console.log(
                  "RESULT      : NO STREAMS"
                );

                return {
                  passed: false,
                  count: 0
                };
              }

              console.log(
                "RESULT      : STREAMS FOUND"
              );

              for (
                let i = 0;
                i < streams.length;
                i++
              ) {
                const stream =
                  streams[i];

                console.log("");
                console.log(
                  `--- STREAM ${i + 1} ---`
                );
                console.log(
                  "Name     :",
                  stream.name
                );
                console.log(
                  "Title    :",
                  stream.title
                );
                console.log(
                  "Quality  :",
                  stream.quality
                );
                console.log(
                  "Type     :",
                  stream.type
                );
                console.log(
                  "Provider :",
                  stream.provider
                );
                console.log(
                  "Size     :",
                  stream.size || "N/A"
                );
                console.log(
                  "URL      :",
                  stream.url
                    ? "PRESENT"
                    : "MISSING"
                );
              }

              return {
                passed: true,
                count: streams.length
              };

            } catch (error) {
              console.log("");
              console.log(
                "========================================"
              );
              console.log(
                `TEST ${index + 1} FAILED`
              );
              console.log(
                "========================================"
              );
              console.error(
                error?.stack || error
              );

              return {
                passed: false,
                count: 0
              };
            }
          }

          async function main() {
            console.log("");
            console.log("========================================");
            console.log("LOADING REANIME PROVIDER");
            console.log("========================================");

            if (
              !provider ||
              typeof provider.getStreams !== "function"
            ) {
              console.error(
                "ERROR: getStreams() was not exported!"
              );
              process.exit(1);
            }

            console.log(
              "Provider loaded successfully."
            );

            console.log(
              "getStreams : OK"
            );

            console.log(
              "onSettings :",
              typeof provider.onSettings ===
                "function"
                ? "OK"
                : "MISSING"
            );

            console.log("");
            console.log(
              "Tests:",
              tests.length
            );

            const results = [];

            for (
              let i = 0;
              i < tests.length;
              i++
            ) {
              results.push(
                await runTest(
                  tests[i],
                  i
                )
              );
            }

            console.log("");
            console.log("");
            console.log(
              "################################################"
            );
            console.log(
              "# FINAL TEST SUMMARY"
            );
            console.log(
              "################################################"
            );

            let passed = 0;

            for (
              let i = 0;
              i < results.length;
              i++
            ) {
              const result =
                results[i];

              if (result.passed) {
                passed++;
              }

              console.log(
                `${i + 1}. ${tests[i].name}`
              );

              console.log(
                "   Result:",
                result.passed
                  ? "STREAMS FOUND"
                  : "NO STREAMS"
              );

              console.log(
                "   Count :",
                result.count
              );
            }

            console.log("");
            console.log(
              "Passed:",
              passed,
              "/",
              tests.length
            );

            console.log("");
            console.log(
              "========================================"
            );
            console.log(
              "ALL PROVIDER TESTS COMPLETE"
            );
            console.log(
              "========================================"
            );

            /*
             * Do NOT fail the GitHub Action merely because
             * FlixCloud returns 403. We need the logs from
             * all three cases to diagnose whether the issue
             * is provider-side or GitHub-runner-side.
             */
            process.exit(0);
          }

          main();
          EOF

          node test-reanime.mjs
