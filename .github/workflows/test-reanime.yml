name: Test ReAnime Providers

on:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AniZip
            branch: Breezy9950-patch-1

          - name: Fribb
            branch: Breezy9950-patch-2

          - name: AniMap
            branch: Breezy9950-patch-3

          - name: IDMapper
            branch: Breezy9950-patch-4

    steps:
      - name: Checkout ${{ matrix.name }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install crypto-js
        run: npm install crypto-js

      - name: Test ReAnime
        env:
          TEST_NAME: ${{ matrix.name }}
          TEST_BRANCH: ${{ matrix.branch }}
        run: |
          node <<'EOF'
          const { getStreams } = require("./providers/reanime.js");

          globalThis.SCRAPER_SETTINGS = {
            reanime_sub: true,
            reanime_dub: true
          };

          const TMDB_ID = "1429";
          const TYPE = "tv";
          const SEASON = 1;
          const EPISODE = 1;

          console.log("");
          console.log("========================================");
          console.log("REANIME PROVIDER TEST");
          console.log("========================================");
          console.log("Method :", process.env.TEST_NAME);
          console.log("Branch :", process.env.TEST_BRANCH);
          console.log("TMDB   :", TMDB_ID);
          console.log("Type   :", TYPE);
          console.log("Season :", SEASON);
          console.log("Episode:", EPISODE);
          console.log("========================================");
          console.log("");

          (async () => {
            try {
              const result = await getStreams(
                TMDB_ID,
                TYPE,
                SEASON,
                EPISODE
              );

              console.log("");
              console.log("========================================");
              console.log("FINAL RESULT");
              console.log("========================================");

              console.log(
                JSON.stringify(result, null, 2)
              );

              console.log("");
              console.log("STREAM COUNT:", Array.isArray(result) ? result.length : "unknown");
              console.log("STATUS: SUCCESS");
              console.log("========================================");
            } catch (error) {
              console.log("");
              console.log("========================================");
              console.log("TEST FAILED");
              console.log("========================================");
              console.error(error);
              console.log("========================================");

              process.exitCode = 1;
            }
          })();
          EOF
